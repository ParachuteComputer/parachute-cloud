# Vault DO + edge router — the wire contract on Durable Objects (Phase 2).
# Tests drive it via @cloudflare/vitest-pool-workers inside workerd; typecheck
# via tsc. Deployed to the new Parachute account — see
# workers/vault/README.md.
#
# ENVIRONMENTS: the TOP LEVEL of this file IS production (scripts/deploy-prod.sh;
# custom domain u.parachute.computer). It cannot move into an [env.production]
# because named envs auto-suffix the worker name (parachute-vault-do-production
# would be a NEW worker — with FRESH, EMPTY Durable Objects) — deploying it would
# detach the Custom Domain AND orphan every existing vault DO. Staging lives in
# [env.staging] below (scripts/deploy-staging.sh; workers.dev only).
#
# BUNDLING (the `.js`→`.ts` question): `@openparachute/core` is raw TypeScript
# whose internal imports use `.js` specifiers pointing at sibling `.ts` files
# (NodeNext). `wrangler deploy`'s built-in esbuild resolves those natively — when
# a TypeScript importer imports `./x.js` and only `./x.ts` exists, esbuild
# rewrites the specifier. So NO custom prebuild/plugin is needed to bundle core;
# the vitest jsToTsResolver (vitest.config.ts) exists only because Vite lacks
# that esbuild behavior. `npm run verify:bundle` emits the bundle and asserts
# core is inlined with zero residual `bun:sqlite`/`bun:` imports, catching any
# regression. The `[alias]` below mirrors the vitest bun:sqlite alias as depth.
name = "parachute-vault-do"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# Keep the workers.dev URL live alongside the custom domain (a fallback; path
# routing works on any host). Declaring a route otherwise disables workers.dev.
workers_dev = true

# Branded vault host: u.parachute.computer serves the vault worker via PATH
# routing (/vault/<name>/*) — one Custom Domain, every vault under it. The design
# calls for per-vault subdomains (<name>.u.parachute.computer), but proxied
# wildcard DNS is Enterprise-gated + the current token lacks dns-edit, so path
# routing on the branded host is the shipped shape (the router already serves the
# subdomain form too, for when the wildcard lands). Declared so `wrangler deploy`
# adopts (never strips) it; workers.dev stays enabled as a fallback.
[[routes]]
pattern = "u.parachute.computer"
custom_domain = true

# my.parachute.computer/vault/* — the one-origin door (Phase A1, URL-TOPOLOGY.md
# rev 2). THREE ZONE ROUTES (not a Custom Domain — my. is already a Custom Domain
# on the IDENTITY worker, workers/identity/wrangler.toml; a zone route on the SAME
# hostname takes PRECEDENCE over a Custom Domain there, confirmed against CF's
# "Interaction with Routes" docs, 2026-07-16, so this worker answers my./vault/*
# at the platform layer before the identity worker or its Static Assets ever see
# the request — zero code, zero proxy hop, no new worker). The router below is
# ALREADY host-agnostic (path routing "works on any host") — no code change.
#
# Three patterns, not one, because RFC 9728/8414 discovery needs more than the
# REST/MCP path itself:
#   - /vault/*                                             REST, MCP, SSE, and
#     the path-APPEND discovery form (/vault/<name>/.well-known/...) — all
#     already live under /vault/, handled by handleDiscovery (discovery.ts).
#   - /.well-known/oauth-protected-resource/vault/*         the path-INSERTION
#   - /.well-known/oauth-authorization-server/vault/*        PRM/ASM forms
#     (discovery.ts matchDiscovery's "insert" branch — .well-known ABOVE the
#     vault path). This is RFC 9728 §3's canonical resource-metadata location,
#     and per discovery.ts's own module comment "the only shape strict clients
#     probe" — mcpWwwAuthenticate's 401 challenge always emits THIS form. Without
#     these two extra routes, a spec-strict client (Claude/ChatGPT) following the
#     WWW-Authenticate challenge on my. would 404 at the IDENTITY worker instead
#     of reaching this discovery doc (my./vault/* alone does not cover a path that
#     starts with /.well-known/). The bare /.well-known/oauth-protected-resource
#     and /.well-known/oauth-authorization-server (no /vault/<name> suffix — the
#     IDENTITY worker's OWN issuer-level metadata) are untouched: both extra
#     patterns require the /vault/<name> suffix, so they never shadow those.
#
# NOTE beyond the literal Phase-A1 brief (flagging for review): the brief named
# only the first pattern. These two are added because the one-origin door's
# discovery flow is provably broken without them — see the PR description's
# "spec friction" note.
[[routes]]
pattern = "my.parachute.computer/vault/*"
zone_name = "parachute.computer"
[[routes]]
pattern = "my.parachute.computer/.well-known/oauth-protected-resource/vault/*"
zone_name = "parachute.computer"
[[routes]]
pattern = "my.parachute.computer/.well-known/oauth-authorization-server/vault/*"
zone_name = "parachute.computer"

# Workers Logs: persist invocation logs + console.* (router errors, DO logs) so
# tail/dashboard/logs-API surface them — before this stanza the account had no
# persistent logs at all (2026-07-02 blind spot). head_sampling_rate 1 = every
# request. Restated explicitly in [env.staging] — explicit beats implicit.
[observability]
enabled = true
head_sampling_rate = 1

# Deploy-bundle mirror of the vitest `bun:sqlite` alias (vitest.config.ts). Core
# value-imports `Database` from bun:sqlite only in type positions (erased at
# transpile), so today this is a no-op — but if a future core change makes the
# import non-type-only, wrangler resolves it to the stub instead of failing on a
# module workerd can't provide. vitest is unaffected (it uses its own Vite alias).
[alias]
"bun:sqlite" = "./src/deploy-stub-bun-sqlite.ts"

# One Durable Object per vault. The router maps <name> → idFromName(name) → DO.
[[durable_objects.bindings]]
name = "VAULT"
class_name = "VaultDO"

# SQLite-backed DO — required for ctx.storage.sql.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["VaultDO"]

# Attachment bytes + (later) export tarballs. Keys: vault-<name>/attachments/...
# The PRODUCTION bucket (`wrangler r2 bucket create parachute-vault` on the new
# Parachute account — clean name; dropped the grandfathered "-dev" suffix at the
# 2026-07-05 account migration). vitest ignores bucket_name (local R2 sim by binding).
# Staging has its own bucket in [env.staging] below.
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "parachute-vault"

# Workers AI — the cloud voice-transcription backend (cloud#56). The DO alarm
# resolves a WorkersAiProvider over this binding and calls
# `@cf/openai/whisper-large-v3-turbo`. `[ai]` is inherited by named envs (unlike
# r2_buckets/durable_objects), but we restate it under [env.staging] anyway for
# explicit-beats-implicit parity with the rest of this file.
[ai]
binding = "AI"

[vars]
# The Identity Worker origin — validates token `iss` + fetches its JWKS +
# revocation list (scope-guard). This is the LIVE value so the deployed config is
# self-contained: it MUST match the identity worker's ISSUER, else every token's
# `iss` fails validation. A bare `wrangler deploy` now sets it correctly (no
# deploy-time `--var` to forget). Tests use TEST_JWKS (gated on ENVIRONMENT=test),
# so this value doesn't affect the vault vitest suite.
ISSUER_ORIGIN = "https://cloud.parachute.computer"
# ADDITIVE set of extra token `iss` values to accept beyond ISSUER_ORIGIN
# (comma-separated). scope-guard unions this with ISSUER_ORIGIN and verifies the
# signature FIRST regardless of `iss`, so widening it never weakens auth. UNSET =
# the single-ISSUER_ORIGIN exact match this worker has always enforced (leave it
# unset for now — behavior is byte-identical). P1.3 flips it to
# "https://cloud.parachute.computer,https://app.parachute.computer" once app. is
# a live Custom Domain on the identity worker; the discovery advertisement keeps
# naming only ISSUER_ORIGIN (acceptance ≠ advertisement).
# ALLOWED_ISSUERS = "https://cloud.parachute.computer,https://app.parachute.computer"
# Subdomain base for hostname routing: <name>.u.parachute.computer → DO(name).
VAULT_BASE_DOMAIN = "u.parachute.computer"
# Default per-tenant storage cap (bytes). 1 GiB. Overridable per-DO in config.
CAP_BYTES = "1073741824"
# Deployment environment. "production" makes the TEST_JWKS double-gate in
# src/auth.ts fully inert (it requires ENVIRONMENT="test" AND a TEST_JWKS var —
# now neither holds). Tests pin ENVIRONMENT="test" in vitest.config.ts bindings.
ENVIRONMENT = "production"
# Semantic search off switch (C2, EXPERIMENTAL) — stated explicitly (unlike
# self-host's unset-means-on default) so the toggle is visible in the deployed
# config. Only the literal "false" disables it; flip + redeploy this worker
# ONLY (the pinned vault-worker-only ladder) to turn it off in an incident.
EMBEDDINGS_ENABLED = "true"

# A single incoming request's CPU budget resets per message; a large import that
# arrives as one request may exceed the 30s default. Raise the ceiling.
# (`limits` is inheritable — staging gets this too.)
[limits]
cpu_ms = 300000

# =============================================================================
# STAGING — `wrangler deploy -e staging` → worker "parachute-vault-do-staging"
# (named envs auto-suffix the name), served ONLY at its workers.dev URL, with its
# own (empty) DO namespace + its own R2 bucket. Top-level [[migrations]] +
# [alias] + [limits] apply here too (top-level-only / inheritable keys).
# Deploy via scripts/deploy-staging.sh; smoke via bun scripts/smoke-staging.ts.
# =============================================================================
[env.staging]
workers_dev = true
# `routes` IS inheritable — without this override a staging deploy would adopt
# the production [[routes]] custom domain (Custom Domains attach to exactly one
# worker, so parachute-vault-do-staging would DETACH u.parachute.computer from
# production). An explicit empty list keeps staging on workers.dev only.
routes = []

# Bindings are non-inheritable: restate the DO + R2 bindings. Same class, but a
# DIFFERENT worker → a completely separate (fresh) set of Durable Objects.
[[env.staging.durable_objects.bindings]]
name = "VAULT"
class_name = "VaultDO"

# Staging's own attachment/export bucket (created 2026-07-02 via
# `wrangler r2 bucket create parachute-vault-staging`).
[[env.staging.r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "parachute-vault-staging"

# Workers AI for staging too. Account-scoped (no per-env resource to create),
# restated for explicit parity — voice transcription is testable end-to-end on
# staging (deploy-staging → smoke's live transcription E2E).
[env.staging.ai]
binding = "AI"

# vars are non-inheritable: restate the full set. ISSUER_ORIGIN MUST equal the
# staging identity worker's ISSUER ([env.staging.vars] in
# workers/identity/wrangler.toml) — staging vaults trust the STAGING issuer.
[env.staging.vars]
ISSUER_ORIGIN = "https://parachute-identity-staging.openparachute.workers.dev"
# ADDITIVE extra-`iss` set (see the top-level [vars] note). UNSET = today's
# single-ISSUER_ORIGIN match. The staging soak first runs it unset (behavior
# unchanged), then sets a synthetic second value pointing at the SAME staging
# JWKS to prove both are accepted before P1.3 wires the real second origin.
# ALLOWED_ISSUERS = ""
VAULT_BASE_DOMAIN = "parachute-vault-do-staging.openparachute.workers.dev"
CAP_BYTES = "1073741824"
# "staging" ≠ "test": the TEST_JWKS double-gate stays closed here too.
ENVIRONMENT = "staging"
# Semantic search off switch (C2, EXPERIMENTAL) — see the top-level [vars] note.
EMBEDDINGS_ENABLED = "true"

# Workers Logs for staging too (explicit per-env restatement; see the top-level
# [observability] note).
[env.staging.observability]
enabled = true
head_sampling_rate = 1
