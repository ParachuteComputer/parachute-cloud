# Cloud Identity Worker — the authorization server for cloud vaults.
# Reproduces the hub's OAuth issuer contract (authorize / token / register /
# revoke / JWKS / revocation-list) on Workers + D1. Deployed to the new Parachute
# account since the 2026-07-05 migration (was Unforced Development, Phase 5a
# 2026-07-02) — see TRYIT-2026-07-02.md.
#
# ENVIRONMENTS: the TOP LEVEL of this file IS production (scripts/deploy-prod.sh;
# custom domain cloud.parachute.computer). It cannot move into an [env.production]
# because named envs auto-suffix the worker name (parachute-identity-production
# would be a NEW worker) — deploying it would strand/detach the Custom Domain
# from the worker that actually holds it. Staging lives in [env.staging] below
# (scripts/deploy-staging.sh; workers.dev only).
name = "parachute-identity"
main = "src/index.ts"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

# Keep the workers.dev URL live alongside the custom domain (a fallback + the
# OAuth wire endpoints work cross-origin regardless of front door). Declaring a
# route otherwise disables workers.dev by default.
workers_dev = true

# Branded front door: the console + OAuth issuer serve at cloud.parachute.computer
# (zone parachute.computer, in the new Parachute account). Declared here so
# `wrangler deploy` adopts (never strips) the custom domain; workers.dev stays
# enabled as a fallback. Custom Domains can't be wildcards — per-vault subdomains
# (*.u.parachute.computer) need proxied wildcard DNS (Enterprise); see TRYIT for
# the enable-later steps.
[[routes]]
pattern = "cloud.parachute.computer"
custom_domain = true

# The Parachute app front door (P1.2, parachute-cloud#116). A SECOND Custom Domain
# on the SAME worker: cloud. keeps 302→/console (it IS CONSOLE_REDIRECT_HOST), while
# app. reaches the `/` Host-branch as a non-console host and serves the SPA shell
# from Static Assets. Additive — `wrangler deploy` adopts this alongside cloud.
# without striping it (Custom Domains attach to exactly one worker; both point here).
[[routes]]
pattern = "app.parachute.computer"
custom_domain = true

# Workers Logs: persist invocation logs + console.* so `wrangler tail`, the
# dashboard, and the logs API can actually surface them. Before this stanza the
# account had NO persistent logs — structured failure lines like
# event=magic_link_send_failed were emitted into the void (a tail probe captured
# zero events, 2026-07-02). head_sampling_rate 1 = log every request; revisit if
# volume ever costs. Restated explicitly in [env.staging] — the docs' guidance
# on env inheritance of observability has varied; explicit beats implicit.
[observability]
enabled = true
head_sampling_rate = 1

# Ops cron (src/ops.ts, routed by the matched pattern in controller.cron):
#   */10 * * * *  → health check: identity D1 self-check + vault /health via
#                   VAULT_ORIGIN; failures email OPERATOR_ALERT_EMAIL with a
#                   1-hour per-check dedupe (ops_alerts, D1).
#   0 14 * * 1    → weekly ops digest (Mon 14:00 UTC ≈ Monday morning MT):
#                   counts-only from D1 (users/vaults/magic-link events).
#   15 * * * *    → hourly onboarding-drip tick (src/drip.ts): day-0 welcome,
#                   day-3 connect nudge (only without AI activity), day-14
#                   feedback ask; drip_sends ledger + per-run cap + unsubscribe.
#   30 3 * * *    → daily per-vault storage-usage rollup (src/usage.ts): read
#                   each vault DO's live db/R2 split through the internal
#                   config seam, upsert one D1 `vault_usage` row per vault per
#                   UTC day (skip+log+continue per vault; USAGE_RUN_CAP bound).
#   0 4 * * *     → nightly GFS snapshot sweep (src/snapshots.ts): each vault
#                   DO snapshots itself under the owner's plan retention (paid
#                   14 daily/8 weekly/12 monthly; free 1 rolling weekly — the
#                   internal DR artifact) and the post-run manifest mirrors
#                   into D1 `vault_snapshots` for the console History section.
# The patterns here MUST stay in sync with HEALTH_CRON/DIGEST_CRON/DRIP_CRON/
# USAGE_CRON/SNAPSHOT_CRON in ops.ts.
[triggers]
crons = ["*/10 * * * *", "0 14 * * 1", "15 * * * *", "30 3 * * *", "0 4 * * *"]

# Control-plane state: users, clients, auth_codes, tokens, grants, sessions,
# signing_keys. The revocation list is DERIVED from the tokens table (exactly
# like the hub) — no separate KV needed. database_id is the real D1 in the
# new Parachute account (`wrangler d1 create parachute-cloud-identity`
# → database_name parachute-identity). vitest ignores it (local D1 simulation by
# binding name); the real deploy connects to it.
[[d1_databases]]
binding = "DB"
database_name = "parachute-identity"
database_id = "5d2b6bbf-727d-4052-9b88-570778e766f6"
migrations_dir = "migrations"

# The rate-limiter DO (#30): one instance per rate key (signup:<ip>,
# login:<ip>|<email>, magic:<ip>|<email>) — atomic sliding-window counters the
# best-effort D1 fences couldn't provide. POLICY (windows/limits) lives in
# src/rate-limit.ts; the client there fails OPEN on DO errors.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

# SQLite-backed DO — required for ctx.storage.sql. ([[migrations]] is shared
# across environments; the staging worker gets the same class on its own
# namespace via [[env.staging.durable_objects.bindings]] below.)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiterDO"]

# =============================================================================
# WORKERS STATIC ASSETS (P1.1, parachute-cloud#116) — serve the Parachute app
# (the notes-ui SPA) FROM this worker, with run_worker_first pinning the server
# ceremonies so the SPA catch-all can never shadow them. This adds the SERVING
# capability only; the app.parachute.computer Custom Domain (P1.2) + the ISSUER
# flip (Phase 4) are separate. On staging (workers.dev) it's provable today.
#
#   directory          — the notes-ui dist, produced by scripts/build-spa.sh (a
#                        VITE_BASE_PATH=/ origin-root build of the pinned
#                        @openparachute/notes-ui — see that script for why the
#                        npm-published dist is the WRONG shape) into ./dist-assets
#                        BEFORE `wrangler deploy`. Gitignored (generated); both
#                        deploy scripts build it first. Relative to this file.
#   binding = ASSETS   — lets the worker's `/` Host-branch fetch the SPA shell
#                        (index.html) for non-console hosts (src/index.ts).
#   not_found_handling — single-page-application: any path with no matching asset
#                        AND not run-worker-first serves index.html, so the SPA
#                        router owns deep links AND the /oauth/callback PKCE
#                        return (which the negation below routes here).
#   run_worker_first   — the EXACT ceremony rule set, derived from
#                        src/route-manifest.ts `runWorkerFirstRules()`: each
#                        CEREMONY_PREFIXES entry → the exact path AND `<prefix>/*`
#                        (CF's `*` is deep but needs trailing content, so
#                        `/console/*` does NOT match bare `/console` — both are
#                        needed); `/` for the Host-branch; `!/oauth/callback` as
#                        the SPA carve-out. Negations have PRECEDENCE over
#                        positives and order is insignificant (CF semantics), so
#                        the callback reliably drops OUT of worker-first even
#                        though `/oauth/*` matches it. run-worker-first.test.ts
#                        asserts this array is byte-equal to the manifest.
# =============================================================================
[assets]
directory = "./dist-assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/.well-known", "/.well-known/*",
  "/oauth", "/oauth/*",
  "/signup", "/signup/*",
  "/login", "/login/*",
  "/logout", "/logout/*",
  "/auth", "/auth/*",
  "/console", "/console/*",
  "/admin", "/admin/*",
  "/account", "/account/*",
  "/billing", "/billing/*",
  "/unsubscribe", "/unsubscribe/*",
  "/health", "/health/*",
  "/__test", "/__test/*",
  "/",
  "!/oauth/callback",
]

[vars]
# These are the LIVE values, so the deployed config is SELF-CONTAINED: a bare
# `wrangler deploy` sets the correct `iss` and can't silently revert it (the prior
# id.parachute.computer placeholder + deploy-time `--var` meant a bare deploy broke
# every new token). The conformance corpus reads these dynamically (it compares
# md.issuer to env.ISSUER), so the value can change here without breaking tests.
#
# ISSUER — every token's `iss` + the discovery-doc base. A cloud vault has no hub,
# so `iss` must equal a real, reachable origin: the branded console host.
ISSUER = "https://cloud.parachute.computer"
# CONSOLE_REDIRECT_HOST (P1.1) — the ONE host whose `/` keeps 302→/console during
# the bridge (the legacy console front door). Every OTHER host that reaches this
# worker at `/` — the app.parachute.computer Custom Domain (added in P1.2) and the
# staging workers.dev origin — serves the SPA shell instead (src/index.ts root
# handler). Set here so cloud.parachute.computer/ stays byte-identical to today;
# UNSET on staging so the workers.dev origin serves the SPA at root (making the
# Static-Assets serving provable before any Custom Domain exists). Compared as a
# bare host (no scheme); unset ⇒ every host serves the SPA at root.
CONSOLE_REDIRECT_HOST = "cloud.parachute.computer"
# BOUND_ORIGINS (P0.5 / P1.3) — extra origins the same-origin gate accepts, beyond
# ISSUER (which is ALWAYS accepted). Comma-separated; each entry is normalized to a
# bare origin. SET to app.parachute.computer now that it's a co-equal SERVING origin
# for the ceremonies (P1.3): the app. Custom Domain is the SAME identity worker, so
# every cookie-authed POST from app. (magic-link request, signup, login, consent,
# checkout) must pass the same-origin gate — without this the accept-set is only
# [ISSUER=cloud.] and every app.-origin POST is rejected as "session expired". The
# token issuer stays cloud. (iss / discovery `issuer` / JWKS / aud unchanged); this
# widens ONLY the origins a POST's Origin/Referer may match. Widening the accept-set
# never weakens CSRF (an independent conjunct) and never admits a foreign origin.
BOUND_ORIGINS = "https://app.parachute.computer"
# APP_ORIGIN (#116) — where a new arrival lands: the app deep-link target for the
# post-create 303, the vault cards' "Open your notes" door, the checklist doors,
# and the day-0 welcome email link. Now that app.parachute.computer serves the app
# + ceremonies on ONE origin, this completes the same-origin journey (signup →
# create → land at app.parachute.computer/?add=…, zero cross-origin hops after
# marketing). UNSET ⇒ the legacy standalone Notes PWA (a stale config degrades to
# a live serving origin, not a 404). NOTE: PWAs installed from notes.parachute.
# computer keep working (that origin still serves; Phase 4 bridges them) — this
# only changes where NEW arrivals land.
APP_ORIGIN = "https://app.parachute.computer"
# Cloud addressing base. With VAULT_ORIGIN set (below) the service-catalog +
# console cards use the path form; unset it to fall back to `https://<name>.<base>`.
VAULT_BASE_DOMAIN = "u.parachute.computer"
# The vault worker's origin — vaults route by PATH (`<origin>/vault/<name>/…`) on
# the single branded host (no wildcard subdomain cert yet). Drives the services
# catalog + the console connect cards.
VAULT_ORIGIN = "https://u.parachute.computer"
# Deployment environment. "production" here (the top level IS the production
# deploy, on the live custom domain): the magic-link send NEVER echoes the link
# in the `x-parachute-dev-magic-link` response header. Headless/smoke testing of
# the magic-link flow happens on STAGING ([env.staging] below, ENVIRONMENT
# "staging"), where the echo header is on and the email sender falls back to
# dev-log (no send_email binding there). Tests pin their own value in
# vitest.config.ts (miniflare bindings), so this var doesn't affect the suite.
ENVIRONMENT = "production"
# FROM address for magic-link email. Its domain must be onboarded to Cloudflare
# Email Sending before real sends succeed (see the send_email binding note below).
EMAIL_FROM = "noreply@parachute.computer"
# Where the scheduled health-check alerts + weekly ops digest go (src/ops.ts).
OPERATOR_ALERT_EMAIL = "ag@unforced.org"
# --- Stripe billing (Wave 4d; full 4-tier × interval matrix) -------------------
# Billing activates only when the two secrets + the four per-tier ANCHOR Prices
# (standard/plus/power monthly + entry quarterly) exist (src/billing-config.ts);
# until then /billing/* answers 503 and the console shows no billing UI. The
# non-anchor Prices are additive — a missing one only disables that ONE
# (tier, interval) combination (checkout → billing_err=invalid).
#   Secrets (NEVER in this file — per environment):
#     wrangler secret put STRIPE_SECRET_KEY                (sk_live_… here; sk_test_… on staging)
#     wrangler secret put STRIPE_WEBHOOK_SECRET            (whsec_… from the dashboard webhook
#                                                           endpoint pointing at POST /billing/webhook,
#                                                           events: checkout.session.completed,
#                                                           invoice.paid, invoice.payment_failed,
#                                                           customer.subscription.deleted,
#                                                           customer.subscription.updated)
#   Price ids (not secret — the LIVE-mode catalog, copied from the sandbox
#   2026-07-06 and wired below; the TEST-mode catalog stays in [env.staging.vars]
#   for staging. Amounts live on the Prices; entry has NO monthly — Stripe's flat
#   fee eats a $1 charge, so entry bills quarterly/yearly):
STRIPE_PRICE_ENTRY_QUARTERLY = "price_1TqJlPIkisoTdlLqJoCC4RF2"     # $3 / 3 months
STRIPE_PRICE_ENTRY_YEARLY = "price_1TqJlOIkisoTdlLqtz2FU70t"        # $10 / yr
STRIPE_PRICE_STANDARD_MONTHLY = "price_1TqJlLIkisoTdlLqwI2s2Dnh"    # $3 / mo
STRIPE_PRICE_STANDARD_QUARTERLY = "price_1TqJlKIkisoTdlLqCeiVroxd"  # $7 / 3 months
STRIPE_PRICE_STANDARD_YEARLY = "price_1TqJlKIkisoTdlLqPEzR54PP"     # $25 / yr
STRIPE_PRICE_PLUS_MONTHLY = "price_1TqJlLIkisoTdlLqeMCZ0LRf"        # $5 / mo
STRIPE_PRICE_PLUS_QUARTERLY = "price_1TqJlKIkisoTdlLqOWh1edDh"      # $12 / 3 months
STRIPE_PRICE_PLUS_YEARLY = "price_1TqJlKIkisoTdlLqkyiPNzvZ"         # $40 / yr
STRIPE_PRICE_POWER_MONTHLY = "price_1TqJlLIkisoTdlLqH0VxbJk7"       # $10 / mo
STRIPE_PRICE_POWER_QUARTERLY = "price_1TqJlKIkisoTdlLqgrtikZGG"     # $25 / 3 months
STRIPE_PRICE_POWER_YEARLY = "price_1TqJlJIkisoTdlLq8eE3JSBr"        # $80 / yr
# --- interim MOCK billing (mock-payments PR) ----------------------------------
# The mock checkout demos the full upgrade → cap/voice-lift flow BEFORE real
# Stripe keys land. It is HARD-gated to non-production (billing-config.ts
# mockBillingEnabled): ENVIRONMENT="production" here means the mock is ALWAYS
# off and /billing/mock-checkout 404s — a free self-upgrade is unreachable in
# prod (pinned by a test + smoke-prod). So there is NOTHING to set here: MOCK_BILLING
# is intentionally NOT declared in this production block. It auto-activates only
# on non-prod deploys with no real Stripe (staging), and goes inert the moment
# real keys land. (MOCK_BILLING="1" is an optional non-prod-only override.)

# --- outbound email (Cloudflare Email Sending) ------------------------------
# Cloudflare Email Sending (public beta, Workers Paid). parachute.computer was
# onboarded 2026-07-02 (`wrangler email sending enable` — SPF + DKIM live in the
# zone), so the binding below makes magic-link email REAL. senderFor()
# (src/index.ts) auto-detects it; with no binding it falls back to the dev-log
# sender. NOTE the echo affordance is independent of the sender: while
# ENVIRONMENT != "production", POST /auth/magic ALSO returns the link in the
# `x-parachute-dev-magic-link` header (headless tests + smoke depend on it);
# a production deploy (ENVIRONMENT="production") never emits the header.
[[send_email]]
name = "EMAIL"

# =============================================================================
# STAGING — `wrangler deploy -e staging` → worker "parachute-identity-staging"
# (named envs auto-suffix the name), served ONLY at its workers.dev URL. Own D1,
# echo header ON (ENVIRONMENT != "production"), and DELIBERATELY no send_email
# binding: bindings are non-inheritable, so staging's sender is the dev-log
# fallback — POST /auth/magic sends no real email and the echo header is the
# deterministic way smoke-staging.ts completes the flow.
# Deploy via scripts/deploy-staging.sh; smoke via bun scripts/smoke-staging.ts.
# =============================================================================
[env.staging]
workers_dev = true
# `routes` IS inheritable — without this override a staging deploy would adopt
# the production [[routes]] custom domain (Custom Domains attach to exactly one
# worker, so parachute-identity-staging would DETACH cloud.parachute.computer
# from production). An explicit empty list keeps staging on workers.dev only.
routes = []

# Staging's own control-plane D1 (created 2026-07-02 via
# `wrangler d1 create parachute-identity-staging`). Same migrations dir; the
# deploy script applies migrations + seeds the dev user here.
[[env.staging.d1_databases]]
binding = "DB"
database_name = "parachute-identity-staging"
database_id = "6930c39f-36a0-463c-b3b6-d6213d647891"
migrations_dir = "migrations"

# Bindings are non-inheritable: restate the rate-limiter DO. Same class; a
# different worker (parachute-identity-staging) = its own DO namespace, so
# staging counters never mix with production's.
[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

# STAGING-ONLY service binding to the vault worker. Staging's VAULT_ORIGIN is a
# workers.dev URL, which is NOT a valid subrequest target from inside a Worker
# (the platform answers 404 without routing — the standing vault-health cron
# alert on staging is the same restriction). Server-side vault calls
# (POST /console/packs) dispatch through this binding here; PRODUCTION stays on
# plain fetch to its custom-domain VAULT_ORIGIN (a proven subrequest target —
# the health cron passes there), so no top-level binding: the vitest config
# reads this file's top level and a service binding would need an auxiliary
# worker under miniflare. Deploy order: the vault worker must exist before an
# identity deploy referencing it (deploy-staging.sh deploys vault first).
[[env.staging.services]]
binding = "VAULT_SERVICE"
service = "parachute-vault-do-staging"

# Static Assets for staging — NON-inheritable, so restate the top-level [assets]
# verbatim (same dist-assets dir, same run_worker_first rule set). This is what
# makes P1.1 provable on staging: the workers.dev origin serves the SPA at root
# (CONSOLE_REDIRECT_HOST is UNSET in [env.staging.vars], so `/` → SPA there) while
# every ceremony still runs the worker first. run-worker-first.test.ts pins this
# array byte-equal to the top-level one AND to the manifest.
[env.staging.assets]
directory = "./dist-assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [
  "/.well-known", "/.well-known/*",
  "/oauth", "/oauth/*",
  "/signup", "/signup/*",
  "/login", "/login/*",
  "/logout", "/logout/*",
  "/auth", "/auth/*",
  "/console", "/console/*",
  "/admin", "/admin/*",
  "/account", "/account/*",
  "/billing", "/billing/*",
  "/unsubscribe", "/unsubscribe/*",
  "/health", "/health/*",
  "/__test", "/__test/*",
  "/",
  "!/oauth/callback",
]

# vars are non-inheritable: restate the full set, pointed at the staging
# workers.dev origins. ISSUER is staging's own origin (tokens minted here carry
# iss=<staging identity>, and the staging vault worker's ISSUER_ORIGIN matches).
[env.staging.vars]
ISSUER = "https://parachute-identity-staging.openparachute.workers.dev"
# CONSOLE_REDIRECT_HOST (P1.1) is DELIBERATELY UNSET on staging — the omission is
# the point: with no console-redirect host, `/` serves the SPA shell at the
# staging workers.dev origin, so the Static-Assets serving is provable here
# before any Custom Domain exists. Production sets it to cloud.parachute.computer
# so only that host keeps 302→/console.
# BOUND_ORIGINS (P0.5 / P1.3) — see the production [vars] note. DELIBERATELY UNSET on
# staging: staging is SINGLE-origin (APP_ORIGIN == ISSUER — the app is served AT the
# staging issuer host), so ISSUER already covers the one origin every POST comes from
# and there is no second origin to add. The two-origin (app. ≠ cloud.) path can't be
# rehearsed on staging; it's covered by the origin-aware unit tests and a prod smoke.
# APP_ORIGIN (#116) — SELF-REFERENTIAL on staging: the app is served AT this
# issuer origin (Static Assets on the staging workers.dev host, CONSOLE_REDIRECT_
# HOST unset), so the post-create arrival + card/checklist deep-links + the drip
# link all point back to this same origin (`<issuer>/?add=…`) — zero cross-origin
# hops, exactly the production shape rehearsed on one origin.
APP_ORIGIN = "https://parachute-identity-staging.openparachute.workers.dev"
VAULT_BASE_DOMAIN = "parachute-vault-do-staging.openparachute.workers.dev"
VAULT_ORIGIN = "https://parachute-vault-do-staging.openparachute.workers.dev"
ENVIRONMENT = "staging"
EMAIL_FROM = "noreply@parachute.computer"
# Same operator address as production — but staging has no send_email binding,
# so ops alerts/digests land in the worker log (devlog sender), never an inbox.
OPERATOR_ALERT_EMAIL = "ag@unforced.org"
# Stripe billing (staging = TEST-mode catalog, account "Open Parachute PBC
# sandbox"). The secrets are already set (`wrangler secret put STRIPE_SECRET_KEY
# -e staging` + `STRIPE_WEBHOOK_SECRET -e staging`; the webhook endpoint points
# at staging /billing/webhook), and the TEST-mode Price ids below complete the
# config — staging billing is REAL (test-mode) Checkout. The ids also carry
# `metadata.plan`/`metadata.interval` + lookup keys `<plan>_<interval>` on the
# Stripe side. See the production [vars] block for the anchor/additive split.
STRIPE_PRICE_ENTRY_QUARTERLY = "price_1TqDRbEzI43yjgruVRBKGVhB"    # $3 / 3 months
STRIPE_PRICE_ENTRY_YEARLY = "price_1TqDRbEzI43yjgrukqPkNDLs"       # $10 / yr
STRIPE_PRICE_STANDARD_MONTHLY = "price_1TqDRbEzI43yjgruNJ0q9lLJ"   # $3 / mo
STRIPE_PRICE_STANDARD_QUARTERLY = "price_1TqDRbEzI43yjgruFwplGZP8" # $7 / 3 months
STRIPE_PRICE_STANDARD_YEARLY = "price_1TqDRbEzI43yjgruxCDggYoE"    # $25 / yr
STRIPE_PRICE_PLUS_MONTHLY = "price_1TqDRcEzI43yjgru2a3W8iiR"       # $5 / mo
STRIPE_PRICE_PLUS_QUARTERLY = "price_1TqDRcEzI43yjgruKTZ0SjrW"     # $12 / 3 months
STRIPE_PRICE_PLUS_YEARLY = "price_1TqDRcEzI43yjgruWhWtyBMm"        # $40 / yr
STRIPE_PRICE_POWER_MONTHLY = "price_1TqDRcEzI43yjgrua4AO4ewF"      # $10 / mo
STRIPE_PRICE_POWER_QUARTERLY = "price_1TqDRdEzI43yjgru9VAzmMKh"    # $25 / 3 months
STRIPE_PRICE_POWER_YEARLY = "price_1TqDRdEzI43yjgru1qOvsRns"       # $80 / yr
# Interim MOCK billing (mock-payments PR): with the full TEST-mode Stripe
# config above, the mock checkout is INERT here — the real (test-mode) Checkout
# path is active and /billing/mock-checkout 404s. MOCK_BILLING="1" would force
# the mock back ON (staging-only demo escape hatch) — normally leave it unset.

# Workers Logs for staging too (explicit per-env restatement; see the top-level
# [observability] note).
[env.staging.observability]
enabled = true
head_sampling_rate = 1

# Same cron schedule as production: the health check + digest + drip + usage
# rollup + snapshot sweep RUN on staging (exercising the real cron path), with
# output to the log instead of email (no send_email binding → devlog sender
# captures drip sends too; the usage rollup + snapshot sweep email no one).
[env.staging.triggers]
crons = ["*/10 * * * *", "0 14 * * 1", "15 * * * *", "30 3 * * *", "0 4 * * *"]

# (no [[env.staging.send_email]] — see the staging banner above; the omission is
# the point: dev-log sender + echo header = deterministic headless testing.)
