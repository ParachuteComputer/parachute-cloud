# Deploy STAGING — runs scripts/deploy-staging.sh (migrations + dev-user seed +
# both workers to [env.staging]) then the FULL live smoke
# (scripts/smoke-staging.ts — creates throwaway accounts/vaults, which is what
# staging is for).
#
# SECRET GATE: this workflow needs three secrets. When any is missing it warns
# loudly and SKIPS the deploy, exiting green — merges to main must not be
# red-gated on a pending ops step.
#
#   CLOUDFLARE_API_TOKEN   ENVIRONMENT secret (`staging`/`production` — the
#                          prod environment adds a required-reviewer approval
#                          gate). API token in the Parachute CF account (d5d7c864…):
#                          Account → Workers Scripts: Edit; Account → D1: Edit;
#                          Account → Workers R2 Storage: Edit;
#                          Zone (parachute.computer) → Workers Routes: Edit.
#   CLOUDFLARE_ACCOUNT_ID  d5d7c8646c3b69ce9f16bfd12ecbe98a (the deploy scripts
#                          also hardcode this — the secret is belt+suspenders
#                          and future-proofs the scripts dropping the hardcode).
#   DEV_SECRETS            The literal contents of workers/identity/.dev-secrets
#                          (gitignored locally): two lines, DEV_USER_EMAIL=…
#                          and DEV_USER_PASSWORD=…. Needed by the staging seed
#                          step and by smoke-staging's operator login.
#
# Manual runs: workflow_dispatch is enabled so the first deploy after the
# secrets land doesn't have to wait for a qualifying push.

name: Deploy staging

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "scripts/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy + smoke (staging)
    runs-on: ubuntu-latest
    # Deploy credentials live in the `staging` GitHub Environment (no approval
    # gate) — job-level `environment:` is what grants access to its secrets.
    environment: staging
    timeout-minutes: 25
    steps:
      - name: Check deploy secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEV_SECRETS: ${{ secrets.DEV_SECRETS }}
        run: |
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          if [ -z "$DEV_SECRETS" ]; then missing="$missing DEV_SECRETS"; fi
          if [ -n "$missing" ]; then
            echo "::notice title=Staging deploy skipped::Missing repo secret(s):$missing. Deploy + smoke skipped (green by design). See the header of .github/workflows/deploy-staging.yml for what to set."
            {
              echo "## Staging deploy skipped"
              echo ""
              echo "Missing repo secret(s): \`$missing\`"
              echo ""
              echo "Set them under Settings → Secrets and variables → Actions, then re-run via workflow_dispatch. Token permissions and the DEV_SECRETS format are documented in the workflow file header."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: steps.gate.outputs.ready == 'true'

      - name: Clone parachute-vault (sibling file dep for @openparachute/core)
        # workers/vault builds against file:../../../parachute-vault/core — a
        # sibling checkout outside this repo. Deploys build against
        # parachute-vault@main, matching local practice (the deploy script's
        # own `bun install` refreshes the copied dep from this clone).
        if: steps.gate.outputs.ready == 'true'
        run: |
          git clone --depth 1 https://github.com/ParachuteComputer/parachute-vault.git "$GITHUB_WORKSPACE/../parachute-vault"
          echo "parachute-vault @ $(git -C "$GITHUB_WORKSPACE/../parachute-vault" rev-parse HEAD)"

      - name: Fetch pinned Parachute App (SPA served by the identity worker)
        # scripts/spa-source.env is the single source pin. Fetching the exact
        # commit makes a Cloud release reproduce the same browser artifact even
        # after parachute-app/main advances.
        if: steps.gate.outputs.ready == 'true'
        run: |
          source scripts/spa-source.env
          APP_REPO="$GITHUB_WORKSPACE/../parachute-app"
          git init "$APP_REPO"
          git -C "$APP_REPO" remote add origin https://github.com/ParachuteComputer/parachute-app.git
          git -C "$APP_REPO" fetch --depth 1 origin "$SPA_APP_REF"
          git -C "$APP_REPO" checkout --detach FETCH_HEAD
          echo "parachute-app v$SPA_APP_VERSION @ $(git -C "$APP_REPO" rev-parse HEAD)"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.gate.outputs.ready == 'true'
        with:
          bun-version: 1.3.13 # keep consistent with local dev

      - name: Materialize pinned Hub door-contract dependency
        if: steps.gate.outputs.ready == 'true'
        run: bash scripts/materialize-door-contract.sh

      - name: Cache bun download cache
        if: steps.gate.outputs.ready == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('package.json', 'workers/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Materialize workers/identity/.dev-secrets
        if: steps.gate.outputs.ready == 'true'
        env:
          DEV_SECRETS: ${{ secrets.DEV_SECRETS }}
        run: printf '%s\n' "$DEV_SECRETS" > workers/identity/.dev-secrets

      - name: Deploy staging (migrations + seed + both workers)
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/deploy-staging.sh

      - name: Live smoke (full, staging-only — creates throwaway debris)
        if: steps.gate.outputs.ready == 'true'
        run: bun scripts/smoke-staging.ts
