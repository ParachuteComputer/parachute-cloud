# Deploy STAGING — runs scripts/deploy-staging.sh (migrations + dev-user seed +
# both workers to [env.staging]) then the FULL live smoke
# (scripts/smoke-staging.ts — creates throwaway accounts/vaults, which is what
# staging is for).
#
# SECRET GATE: this workflow needs two secrets. When either is missing it warns
# loudly and SKIPS the deploy, exiting green — merges to main must not be
# red-gated on a pending ops step.
#
#   CLOUDFLARE_API_TOKEN   ENVIRONMENT secret of the `staging` environment. Since
#                          T-432 staging lives on its OWN account, "Parachute
#                          Staging" (5b543fa4…, scripts/staging-account.env), so
#                          this is a token on THAT account only: Account → Workers
#                          Scripts: Edit; Account → D1: Edit. No zone rights (the
#                          account has no zone). A token on the production account
#                          gets 403 here: [env.staging] pins account_id.
#                          The account comes from scripts/staging-account.env, not
#                          a secret (the repo-level CLOUDFLARE_ACCOUNT_ID is
#                          production's and is not passed to this workflow).
#   DEV_SECRETS            The literal contents of workers/identity/.dev-secrets
#                          (gitignored locally): two lines, DEV_USER_EMAIL=…
#                          and DEV_USER_PASSWORD=…. Needed by the staging seed
#                          step and by smoke-staging's operator login.
#
# Manual runs: workflow_dispatch is enabled so the first deploy after the
# secrets land doesn't have to wait for a qualifying push.
#
# CI GATE: the `ci-green` job runs first and waits until ci.yml's three jobs
# have passed on the commit being deployed; a red or cancelled CI job fails it
# and nothing deploys. A manual run of a commit CI never ran on is refused.

name: Deploy staging

on:
  push:
    branches: [main]
    paths:
      - "workers/**"
      - "scripts/**"
      - ".github/workflows/deploy-staging.yml"
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # Nothing deploys until ci.yml's three jobs have passed on this exact commit. The same push starts CI, so this
  # waits for it (CI's jobs time out at 20 minutes) and fails at the first red job. A manual run is gated too.
  ci-green:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ github.sha }}
      WAIT_MINUTES: 40
      # A push started CI on this commit too, so wait for its checks to appear. A manual run of a commit CI never ran
      # on is refused at once.
      WAIT_FOR_MISSING: ${{ github.event_name == 'push' }}
      # The job names in ci.yml, as GitHub shows them. Rename a job there, rename it here.
      REQUIRED: |
        identity worker (typecheck + vitest/workerd)
        vault worker (typecheck + vitest/workerd)
        control plane (root bun test)
    steps:
      - name: wait for CI on this commit to pass
        run: |
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while :; do
            waiting=""
            while IFS= read -r name; do
              [ -n "$name" ] || continue
              # The newest attempt of the job with that name on this commit, from GitHub Actions (app 15368).
              state=$(gh api -X GET "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs" \
                -f check_name="$name" -f app_id=15368 -f filter=all -f per_page=100 \
                --jq '.check_runs | max_by(.id) | if . == null then "missing" else "\(.status)/\(.conclusion)" end') \
                || state="unreadable (retrying)"
              echo "$state  $name"
              case "$state" in
                completed/success) ;;
                completed/*)
                  echo "::error::\"$name\" is $state on $SHA. Fix it or re-run it, then re-run this job."
                  exit 1 ;;
                missing)
                  if [ "$WAIT_FOR_MISSING" != true ]; then
                    echo "::error::$SHA has no \"$name\" check. CI runs on pull requests and on pushes to main, next and door/0.9."
                    exit 1
                  fi
                  waiting=1 ;;
                *) waiting=1 ;;
              esac
            done <<< "$REQUIRED"
            if [ -z "$waiting" ]; then echo "Every required check passed on $SHA."; exit 0; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::The required checks on $SHA did not all finish within $WAIT_MINUTES minutes."
              exit 1
            fi
            echo "--- waiting"
            sleep 60
          done

  deploy:
    name: deploy + smoke (staging)
    needs: ci-green
    runs-on: ubuntu-latest
    # Deploy credentials live in the `staging` GitHub Environment (no approval
    # gate) — job-level `environment:` is what grants access to its secrets.
    environment: staging
    timeout-minutes: 25
    steps:
      - name: Check deploy secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEV_SECRETS: ${{ secrets.DEV_SECRETS }}
        run: |
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$DEV_SECRETS" ]; then missing="$missing DEV_SECRETS"; fi
          if [ -n "$missing" ]; then
            echo "::notice title=Staging deploy skipped::Missing deploy secret(s):$missing. Deploy + smoke skipped (green by design). See the header of .github/workflows/deploy-staging.yml for what to set."
            {
              echo "## Staging deploy skipped"
              echo ""
              echo "Missing deploy secret(s): \`$missing\`"
              echo ""
              echo "Set CLOUDFLARE_API_TOKEN (a Parachute Staging account token) under Settings → Environments → staging and DEV_SECRETS under Settings → Secrets and variables → Actions, then re-run via workflow_dispatch. Token permissions and the DEV_SECRETS format are documented in the workflow file header."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: steps.gate.outputs.ready == 'true'

      - name: Check the staging account is bootstrapped
        # T-432: staging lives on its own account. Until scripts/staging-bootstrap.sh has created the staging D1 there
        # and its id is committed, deploy-staging.sh refuses; skip green instead, like the secret gate above.
        id: boot
        if: steps.gate.outputs.ready == 'true'
        run: |
          # The same check deploy-staging.sh refuses on: a real id, written in both files.
          . scripts/staging-account.env
          if [ "$STAGING_D1_ID" = 00000000-0000-0000-0000-000000000000 ] \
             || ! grep -q "database_id = \"$STAGING_D1_ID\"" workers/identity/wrangler.toml; then
            echo "::notice title=Staging deploy skipped::The staging D1 id is the placeholder or not in both scripts/staging-account.env and workers/identity/wrangler.toml: run scripts/staging-bootstrap.sh on the Parachute Staging account and commit both files."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch pinned Parachute App (SPA served by the identity worker)
        # scripts/spa-source.env is the single source pin. Fetching the exact
        # commit makes a Cloud release reproduce the same browser artifact even
        # after parachute-app/main advances.
        if: steps.boot.outputs.ready == 'true'
        run: |
          source scripts/spa-source.env
          APP_REPO="$GITHUB_WORKSPACE/../parachute-app"
          git init "$APP_REPO"
          git -C "$APP_REPO" remote add origin https://github.com/ParachuteComputer/parachute-app.git
          git -C "$APP_REPO" fetch --depth 1 origin "$SPA_APP_REF"
          git -C "$APP_REPO" checkout --detach FETCH_HEAD
          echo "parachute-app v$SPA_APP_VERSION @ $(git -C "$APP_REPO" rev-parse HEAD)"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.boot.outputs.ready == 'true'
        with:
          bun-version: 1.4 # floor: Bun 1.4

      - name: Materialize pinned parachute-core engine dependency
        # workers/vault builds against file:../../../parachute-core/packages/vault/core — a
        # sibling checkout outside this repo. Deploys materialize the exact
        # commit pinned in scripts/core-source.env (the deploy script's own
        # `bun install` refreshes the copied dep from this checkout).
        if: steps.boot.outputs.ready == 'true'
        run: bash scripts/materialize-vault-core.sh

      - name: Materialize pinned Hub door-contract dependency
        if: steps.boot.outputs.ready == 'true'
        run: bash scripts/materialize-door-contract.sh

      - name: Cache bun download cache
        if: steps.boot.outputs.ready == 'true'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('package.json', 'workers/*/package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Materialize workers/identity/.dev-secrets
        if: steps.boot.outputs.ready == 'true'
        env:
          DEV_SECRETS: ${{ secrets.DEV_SECRETS }}
        run: printf '%s\n' "$DEV_SECRETS" > workers/identity/.dev-secrets

      - name: Deploy staging (migrations + seed + both workers)
        if: steps.boot.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash scripts/deploy-staging.sh

      - name: Live smoke (full, staging-only — creates throwaway debris)
        if: steps.boot.outputs.ready == 'true'
        run: bun scripts/smoke-staging.ts

      - name: Deletion proof (T-318 — every store purged; blocking)
        if: steps.boot.outputs.ready == 'true'
        run: bun scripts/smoke-delete-staging.ts
